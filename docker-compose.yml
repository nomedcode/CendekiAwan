name: cloudlens

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cloudlens}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cloudlens}
      POSTGRES_DB: ${POSTGRES_DB:-cloudlens}
    ports:
      # loopback only, for running the backend/tests from the host in phase 1
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cendekiawan} -d ${POSTGRES_DB:-cendekiawan}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - appnet

volumes:
  pgdata:

networks:
  appnet:
    driver: bridge
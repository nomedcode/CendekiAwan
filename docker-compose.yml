name: cendekiawan

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cendekiawan}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cendekiawan}
      POSTGRES_DB: ${POSTGRES_DB:-cendekiawan}
    ports:
      # loopback only, for running the backend/tests from the host in phase 1
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cendekiawan} -d ${POSTGRES_DB:-cendekiawan}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - appnet

  floci:
    image: floci/floci:2.4.0
    ports:
      - "4566:4566"
    environment:
      FLOCI_SERVICES_UI_ENABLED: "false"
      FLOCI_STORAGE_MODE: persistent
      FLOCI_STORAGE_PERSISTENT_PATH: /var/lib/floci/data
      FLOCI_DEFAULT_REGION: us-east-1
    volumes:
      - flocidata:/var/lib/floci/data
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      # no curl/wget in the image; bash /dev/tcp is the cheapest probe available
      test: ["CMD-SHELL", "timeout 2 bash -c 'exec 3<>/dev/tcp/127.0.0.1/4566'"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 30s
    networks:
      - appnet

volumes:
  pgdata:
  flocidata:

networks:
  appnet:
    driver: bridge